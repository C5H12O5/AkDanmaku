apply plugin: 'maven-publish'
apply plugin: 'signing'

task androidSourcesJar(type: Jar) {
    if (project.hasProperty('android')) {
        from(android.sourceSets.main.java.srcDirs) {
            include '**/*.java'
            include '**/*.kt'
        }
    } else {
        from sourceSets.main.allSource
    }
    archiveClassifier.set('sources')
}
task javadocJar(type: Jar) {
    from rootProject.file('README.md')
    from(rootProject.file('docs')) {
        into 'docs'
    }
    archiveClassifier.set('javadoc')
}
tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('encoding', 'UTF-8')
    options.addStringOption('charSet', 'UTF-8')
}

ext {
    PUBLISH_ARTIFACT_ID = "akdanmaku"
}

afterEvaluate {
    def releaseSigningRequested = gradle.startParameter.taskNames.any {
        ['centralBundle', 'signReleasePublication'].contains(it.tokenize(':').last())
    }
    def publicationPath = "${GROUP.replace('.', '/')}/${PUBLISH_ARTIFACT_ID}/${VERSION_NAME}"
    def clearCentralBundleStaging = tasks.register('clearCentralBundleStaging', Delete) {
        delete "$buildDir/repos/staging/$publicationPath"
    }
    def publishToLocalStagingTaskName = 'publishReleasePublicationToLocalStagingRepository'
    tasks.matching { it.name == publishToLocalStagingTaskName }.configureEach {
        mustRunAfter clearCentralBundleStaging
    }
    tasks.register('centralBundle', Zip) {
        group = 'publishing'
        description = 'Builds a signed Maven Central deployment bundle.'
        dependsOn clearCentralBundleStaging, publishToLocalStagingTaskName
        from("$buildDir/repos/staging") {
            include "$publicationPath/**"
            exclude '**/*.asc.md5'
            exclude '**/*.asc.sha1'
            exclude '**/*.asc.sha256'
            exclude '**/*.asc.sha512'
        }
        archiveFileName.set("${PUBLISH_ARTIFACT_ID}-${VERSION_NAME}-central-bundle.zip")
        destinationDirectory.set(file("$buildDir/distributions"))
    }

    publishing {
        publications {
            release(MavenPublication) {

                groupId GROUP
                artifactId 'akdanmaku'
                version VERSION_NAME

               if (project.hasProperty("android")) {
                   artifact("$buildDir/outputs/aar/library-release.aar") {
                       builtBy tasks.named('bundleReleaseAar')
                   }
                   artifact androidSourcesJar
                   artifact javadocJar
               } else {
                   artifact("$buildDir/libs/${project.getName()}.jar")
                   artifact androidSourcesJar
                   artifact javadocJar
               }
                pom {
                    packaging 'aar'
                    name = 'AkDanmaku'
                    description = rootProject.name
                    version = VERSION_NAME
                    url = POM_URL
                    licenses {
                        license {
                            name = POM_LICENCE_NAME
                            url = POM_LICENCE_URL
                        }
                    }
                    developers {
                        developer {
                            id = POM_DEVELOPER_ID
                            name = POM_DEVELOPER_NAME
                        }
                    }
                    scm {
                        connection = POM_SCM_CONNECTION
                        developerConnection = POM_SCM_DEV_CONNECTION
                        url = POM_SCM_URL
                    }
                    withXml {
                        def dependenciesNode = asNode().appendNode('dependencies')

                        project.configurations.implementation.allDependencies.each {
                            if (it.group != null) {
                                def dependencyNode = dependenciesNode.appendNode('dependency')
                                dependencyNode.appendNode('groupId', it.group)
                                dependencyNode.appendNode('artifactId', it.name)
                                dependencyNode.appendNode('version', it.version)
                            }
                        }
                    }
                }
            }
        }
        repositories {
            maven {
                name = 'LocalStaging'
                url = uri("$buildDir/repos/staging")
            }
        }
    }
    signing {
        if (releaseSigningRequested) {
            def signingKey = findProperty('signingKey')
            if (signingKey) {
                useInMemoryPgpKeys(signingKey, findProperty('signingPassword'))
            } else {
                if (!project.hasProperty('signing.gnupg.executable')) {
                    project.ext['signing.gnupg.executable'] = 'gpg'
                }
                if (!project.hasProperty('signing.gnupg.keyName')) {
                    project.ext['signing.gnupg.keyName'] = PUBLISH_SIGNING_KEY
                }
                useGpgCmd()
            }
        }

        // Local validation stays unsigned unless the upload bundle is requested.
        required = { releaseSigningRequested }
        sign publishing.publications.release
    }
}

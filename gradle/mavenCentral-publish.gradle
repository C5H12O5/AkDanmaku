apply plugin: 'maven-publish'
apply plugin: 'signing'

task androidSourcesJar(type: Jar) {
    if (project.hasProperty('android')) {
        from(android.sourceSets.main.java.srcDirs) {
            include '**/*.java'
            include '**/*.kt'
        }
    } else {
        from sourceSets.main.allSource
    }
    archiveClassifier.set('sources')
}
task javadocJar(type: Jar) {
    from rootProject.file('README.md')
    from(rootProject.file('docs')) {
        into 'docs'
    }
    archiveClassifier.set('javadoc')
}
tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('encoding', 'UTF-8')
    options.addStringOption('charSet', 'UTF-8')
}

ext {
    PUBLISH_ARTIFACT_ID = "akdanmaku"
}

ext['ossrhUsername'] = ''
ext['ossrhPassword'] = ''

File secretPropsFile = project.rootProject.file('local.properties')
if (secretPropsFile.exists()) {
    println 'Found secret props file, loading props'
    Properties p = new Properties()
    p.load(new FileInputStream(secretPropsFile))
    p.each { name, value ->
        ext[name] = value
    }
} else {
    println 'No props file, loading env vars'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {

                groupId GROUP
                artifactId 'akdanmaku'
                version VERSION_NAME

               if (project.hasProperty("android")) {
                   artifact("$buildDir/outputs/aar/library-release.aar") {
                       builtBy tasks.named('bundleReleaseAar')
                   }
                   artifact androidSourcesJar
                   artifact javadocJar
               } else {
                   artifact("$buildDir/libs/${project.getName()}.jar")
                   artifact androidSourcesJar
                   artifact javadocJar
               }
                pom {
                    packaging 'aar'
                    name = 'AkDanmaku'
                    description = rootProject.name
                    version = VERSION_NAME
                    url = POM_URL
                    licenses {
                        license {
                            name = POM_LICENCE_NAME
                            url = POM_LICENCE_URL
                        }
                    }
                    developers {
                        developer {
                            id = POM_DEVELOPER_ID
                            name = POM_DEVELOPER_NAME
                        }
                    }
                    scm {
                        connection = POM_SCM_CONNECTION
                        developerConnection = POM_SCM_DEV_CONNECTION
                        url = POM_SCM_URL
                    }
                    withXml {
                        def dependenciesNode = asNode().appendNode('dependencies')

                        project.configurations.implementation.allDependencies.each {
                            if (it.group != null) {
                                def dependencyNode = dependenciesNode.appendNode('dependency')
                                dependencyNode.appendNode('groupId', it.group)
                                dependencyNode.appendNode('artifactId', it.name)
                                dependencyNode.appendNode('version', it.version)
                            }
                        }
                    }
                }
            }
        }
        repositories {
            maven {
                name = 'LocalStaging'
                url = uri("$buildDir/repos/staging")
            }
            maven {
                name = 'AkDanmaku'
                url = 'https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/'

                credentials {
                    username ossrhUsername
                    password ossrhPassword
                }
            }
        }
    }
    signing {
        // File repositories are unsigned for local validation; remote uploads must remain signed.
        required = {
            gradle.taskGraph.allTasks.any {
                it instanceof org.gradle.api.publish.maven.tasks.PublishToMavenRepository &&
                    it.repository.url.scheme != 'file'
            }
        }
        sign publishing.publications.release
    }
}
